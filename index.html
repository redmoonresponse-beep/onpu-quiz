<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>音あてクイズ 🎹</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#f5f4ef;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items: center;
  padding: 10px;
}
#app{width:100%; max-width: 900px;}

/* 横画面用のレイアウト設定 */
.main-container {
  display: flex;
  flex-direction: row; /* 横並び */
  gap: 15px;
  align-items: stretch;
}

/* 縦画面（スマホ通常）の場合は縦並びに戻す */
@media (max-aspect-ratio: 1/1) {
  .main-container { flex-direction: column; }
}

.left-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.right-panel { flex: 1.2; display: flex; flex-direction: column; justify-content: center; }

.card { background:#fff; border:1px solid #e5e4de; border-radius:12px; padding:10px; }

/* スコアと問題数 */
.stats-row{ display:flex; gap:10px; margin-bottom: 10px; }
.stat{ flex:1; background:#fff; border-radius:10px; padding:5px; text-align:center; border:1px solid #e5e4de; }
.stat-label{ font-size:10px; color:#999; }
.stat-value{ font-size:16px; font-weight:600; }

/* 五線譜 */
.staff-container{ background: #fff; display: flex; justify-content: center; }
#staff-svg { width: 100%; max-height: 120px; }

/* 花のステージ */
#flower-stage { width:100%; height:120px; background: #fff; border-radius: 8px; }

/* ピアノ */
.piano-outer { position: relative; width: 100%; height: 160px; margin: 0 auto; user-select: none; }
.piano { position: relative; width: 350px; height: 150px; margin: 0 auto; }
.white-key {
  position:absolute; width:50px; height:150px;
  background:#fff; border:1px solid #ccc; border-radius:0 0 5px 5px;
  cursor:pointer; z-index:1; transition: background 0.1s;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; font-size: 12px; color: #bbb;
}
.white-key.pressed { background:#ddd; transform: translateY(2px); }
.black-key {
  position:absolute; width:32px; height:90px;
  background:#333; border-radius:0 0 3px 3px;
  cursor:pointer; z-index:2; transition: background 0.1s;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-size: 10px; color: #666;
}
.black-key.pressed { background:#000; transform: translateY(2px); }

.play-btn{ width:100%; padding:10px; border-radius:10px; border:1px solid #ddd; background:#fff; cursor:pointer; font-weight: bold; }
.next-btn{ display:none; width:100%; padding:15px; border-radius:10px; background:#4a8c3f; color:#fff; border:none; cursor:pointer; font-size: 16px; margin-top: 10px;}
.next-btn.visible{ display:block; }

/* 結果表示 */
.result-card { display:none; text-align:center; padding: 20px; }
.result-card.visible { display:block; }
.restart-btn { margin-top:15px; padding:12px 24px; border-radius:25px; background:#1a1a1a; color:#fff; border:none; cursor:pointer; font-size: 16px; }

</style>
</head>
<body>
<div id="app">
  <div id="quiz-section">
    <div class="stats-row">
      <div class="stat"><div class="stat-label">問題</div><div class="stat-value" id="q-num">1 / 10</div></div>
      <div class="stat"><div class="stat-label">正解数</div><div class="stat-value" id="correct-count">0</div></div>
    </div>

    <div class="main-container">
      <div class="left-panel">
        <div class="card staff-container">
          <svg id="staff-svg" viewBox="0 0 200 100">
            <line x1="10" y1="30" x2="190" y2="30" stroke="#ccc" />
            <line x1="10" y1="40" x2="190" y2="40" stroke="#ccc" />
            <line x1="10" y1="50" x2="190" y2="50" stroke="#ccc" />
            <line x1="10" y1="60" x2="190" y2="60" stroke="#ccc" />
            <line x1="10" y1="70" x2="190" y2="70" stroke="#ccc" />
            <text x="15" y="65" font-size="40" fill="#333" font-family="serif">𝄞</text>
            <g id="note-group"></g>
          </svg>
        </div>
        <div class="card" id="flower-stage">
          <svg width="100%" height="100%" viewBox="0 0 300 120">
            <ellipse cx="150" cy="115" rx="50" ry="5" fill="#d2b48c" />
            <line id="stem" x1="150" y1="115" x2="150" y2="115" stroke="#4a8c3f" stroke-width="4" />
            <circle id="flower-head" cx="150" cy="115" r="0" fill="#f06292" />
          </svg>
        </div>
        <button class="play-btn" onclick="playCurrentNote()">▶ 音を聴く</button>
      </div>

      <div class="right-panel">
        <div class="piano-outer">
          <div class="piano" id="piano-container"></div>
        </div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題へ ➔</button>
      </div>
    </div>
  </div>

  <div class="card result-card" id="result-section">
    <h2 id="result-status">終了！</h2>
    <div style="font-size:48px; margin: 15px 0; font-weight: bold;" id="result-score">0 / 10</div>
    <p id="result-msg" style="margin-bottom: 10px;"></p>
    <button class="restart-btn" onclick="restartQuiz()">もう一度する</button>
  </div>
</div>

const notes = ["ド", "レ", "ミ", "ファ", "ソ", "ラ", "シ"];
const noteStaffY = [78, 73, 68, 63, 58, 53, 48];
let currentQ = 0;
let correctCount = 0;
let isAnswered = false;
let flowerHeight = 0; 

function initPiano() {
  const piano = document.getElementById('piano-container');
  const whiteKeys = ["ド", "レ", "ミ", "ファ", "ソ", "ラ", "シ"];
  const blackKeys = [{n:"ド#", p:34}, {n:"レ#", p:84}, {n:null}, {n:"ファ#", p:184}, {n:"ソ#", p:234}, {n:"ラ#", p:284}];
  
  whiteKeys.forEach((note, i) => {
    const key = document.createElement('div');
    key.className = 'white-key';
    key.style.left = (i * 50) + 'px';
    key.textContent = note;
    key.onclick = () => checkAnswer(note, key);
    piano.appendChild(key);
  });

  blackKeys.forEach((bk) => {
    if(!bk.n) return;
    const key = document.createElement('div');
    key.className = 'black-key';
    key.style.left = bk.p + 'px';
    key.textContent = bk.n;
    key.onclick = () => {
      key.classList.add('pressed');
      setTimeout(()=>key.classList.remove('pressed'), 100);
    };
    piano.appendChild(key);
  });
}

function playCurrentNote() {
  const audio = new Audio("data:audio/wav;base64," + AUDIO_DATA);
  audio.play();
}

function drawNote(noteIndex) {
  const group = document.getElementById('note-group');
  group.innerHTML = '';
  const y = noteStaffY[noteIndex];
  const ellipse = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
  ellipse.setAttribute("cx", "100"); ellipse.setAttribute("cy", y);
  ellipse.setAttribute("rx", "6"); ellipse.setAttribute("ry", "4.5");
  ellipse.setAttribute("fill", "#333");
  ellipse.setAttribute("transform", `rotate(-20, 100, ${y})`);
  group.appendChild(ellipse);
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", "105"); line.setAttribute("y1", y);
  line.setAttribute("x2", "105"); line.setAttribute("y2", y - 25);
  line.setAttribute("stroke", "#333"); line.setAttribute("stroke-width", "1.5");
  group.appendChild(line);
  if (noteIndex === 0) {
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", "90"); l.setAttribute("y1", "78");
    l.setAttribute("x2", "110"); l.setAttribute("y2", "78");
    l.setAttribute("stroke", "#333"); group.appendChild(l);
  }
}

function checkAnswer(note, element) {
  if (isAnswered) return;
  isAnswered = true;
  element.classList.add('pressed');
  if (note === "ド") {
    correctCount++;
    document.getElementById('correct-count').textContent = correctCount;
  }
  document.getElementById('next-btn').classList.add('visible');
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= 10) {
    showResult();
  } else {
    isAnswered = false;
    document.querySelectorAll('.white-key').forEach(k=>k.classList.remove('pressed'));
    document.getElementById('q-num').textContent = `${currentQ + 1} / 10`;
    document.getElementById('next-btn').classList.remove('visible');
    drawNote(0);
  }
}

function showResult() {
  document.getElementById('quiz-section').style.display = 'none';
  const section = document.getElementById('result-section');
  section.classList.add('visible');
  document.getElementById('result-score').textContent = `${correctCount}問正解 / 10問中`;
  if (correctCount >= 7) {
    document.getElementById('result-msg').textContent = "🌸 70%以上正解！花が育ったよ！";
    growFlower();
  } else {
    document.getElementById('result-msg').textContent = "🌵 70%以上で花が育つよ。また頑張ろう！";
  }
}

function growFlower() {
  flowerHeight += 20;
  if(flowerHeight > 80) flowerHeight = 80;
  document.getElementById('stem').setAttribute('y2', 115 - flowerHeight);
  document.getElementById('flower-head').setAttribute('cy', 115 - flowerHeight);
  if(flowerHeight >= 40) document.getElementById('flower-head').setAttribute('r', 12);
}

function restartQuiz() {
  currentQ = 0; correctCount = 0; isAnswered = false;
  document.getElementById('q-num').textContent = "1 / 10";
  document.getElementById('correct-count').textContent = "0";
  document.getElementById('quiz-section').style.display = 'block';
  document.getElementById('result-section').classList.remove('visible');
  document.getElementById('next-btn').classList.remove('visible');
  document.querySelectorAll('.white-key').forEach(k=>k.classList.remove('pressed'));
  drawNote(0);
}

initPiano();
drawNote(0);
</script>
</body>
</html>
