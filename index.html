<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>音あてクイズ 🎹</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family: sans-serif;
  background:#f5f4ef;
  display:flex;
  justify-content:center;
  padding: 10px;
}
#app{ width:100%; max-width: 600px; }

.stats-row{ display:flex; gap:10px; margin-bottom: 10px; }
.stat{ flex:1; background:#fff; border-radius:10px; padding:8px; text-align:center; border:1px solid #e5e4de; }
.stat-label{ font-size:12px; color:#999; }
.stat-value{ font-size:18px; font-weight:bold; }

.staff-card { background:#fff; border:1px solid #e5e4de; border-radius:12px; padding:20px; margin-bottom:15px; text-align:center; }
#staff-svg { width: 100%; max-width: 400px; height: auto; }

/* 鍵盤エリアの設定 */
.piano-container {
  position: relative;
  width: 100%;
  height: 180px;
  background: #fff;
  border-radius: 8px;
  border: 1px solid #ccc;
  overflow: hidden;
  margin-bottom: 20px;
}

.white-key {
  position: absolute;
  top: 0;
  width: 12.5%; /* 8枚の鍵盤を均等に配置 */
  height: 100%;
  background: white;
  border: 1px solid #ccc;
  border-radius: 0 0 5px 5px;
  cursor: pointer;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 10px;
  font-size: 14px;
  font-weight: bold;
  z-index: 1;
}
.white-key:active, .white-key.correct { background: #e0f7fa; }

.black-key {
  position: absolute;
  top: 0;
  width: 8%;
  height: 60%;
  background: #333;
  border-radius: 0 0 3px 3px;
  z-index: 2;
}

.next-btn {
  display: none;
  width: 100%;
  padding: 15px;
  background: #4a8c3f;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
}
.visible { display: block; }

.result-card { display:none; text-align:center; padding: 40px 20px; background:#fff; border-radius:12px; }
</style>
</head>
<body>

<div id="app">
  <div id="quiz-section">
    <div class="stats-row">
      <div class="stat"><div class="stat-label">問題</div><div class="stat-value" id="q-num">1 / 10</div></div>
      <div class="stat"><div class="stat-label">正解</div><div class="stat-value" id="correct-count">0</div></div>
    </div>

    <div class="staff-card">
      <svg id="staff-svg" viewBox="0 0 200 100">
        <line x1="10" y1="30" x2="190" y2="30" stroke="#ccc" />
        <line x1="10" y1="40" x2="190" y2="40" stroke="#ccc" />
        <line x1="10" y1="50" x2="190" y2="50" stroke="#ccc" />
        <line x1="10" y1="60" x2="190" y2="60" stroke="#ccc" />
        <line x1="10" y1="70" x2="190" y2="70" stroke="#ccc" />
        <text x="15" y="65" font-size="40" fill="#333" font-family="serif">𝄞</text>
        <g id="note-group"></g>
      </svg>
    </div>

    <div class="piano-container" id="piano">
      </div>

    <button class="next-btn" id="next-btn" onclick="nextQuestion()">つぎへ ➔</button>
  </div>

  <div class="result-card" id="result-section">
    <h2>おしまい！</h2>
    <div style="font-size:48px; margin: 20px 0;" id="result-score">0 / 10</div>
    <button onclick="location.reload()" style="padding:10px 20px; border-radius:20px;">もういちど遊ぶ</button>
  </div>
</div>
