<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>音あてクイズ 🎹</title>
<style>
  body { font-family: sans-serif; background: #f0f0f0; text-align: center; margin: 0; padding: 20px; }
  #app { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  
  /* 譜面エリア */
  .staff-box { background: white; border: 1px solid #ccc; margin-bottom: 20px; padding: 10px; }
  
  /* 鍵盤エリア - ここが確実に表示されるようにしました */
  .piano {
    display: flex;
    justify-content: center;
    width: 100%;
    height: 150px;
    margin-bottom: 20px;
    background: #333;
    padding: 5px;
    border-radius: 5px;
  }
  .key {
    flex: 1;
    background: white;
    border: 1px solid #333;
    border-radius: 0 0 5px 5px;
    cursor: pointer;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 10px;
    font-size: 14px;
    font-weight: bold;
    user-select: none;
  }
  .key:active { background: #e0e0e0; }

  .stats { margin-bottom: 10px; font-size: 18px; }
  .next-btn {
    display: none; width: 100%; padding: 15px; font-size: 18px;
    background: #4CAF50; color: white; border: none; border-radius: 10px; cursor: pointer;
  }
</style>
</head>
<body>

<div id="app">
  <div class="stats">
    だい <span id="q-num">1</span> / 10 問 | せいかい: <span id="correct-count">0</span>
  </div>

  <div class="staff-box">
    <svg viewBox="0 0 200 100" width="100%">
      <line x1="10" y1="30" x2="190" y2="30" stroke="#000" />
      <line x1="10" y1="40" x2="190" y2="40" stroke="#000" />
      <line x1="10" y1="50" x2="190" y2="50" stroke="#000" />
      <line x1="10" y1="60" x2="190" y2="60" stroke="#000" />
      <line x1="10" y1="70" x2="190" y2="70" stroke="#000" />
      <text x="15" y="65" font-size="30">𝄞</text>
      <g id="note-layer"></g>
    </svg>
  </div>

  <div class="piano" id="piano-box">
    <div class="key" onclick="check('ド')">ド</div>
    <div class="key" onclick="check('レ')">レ</div>
    <div class="key" onclick="check('ミ')">ミ</div>
    <div class="key" onclick="check('ファ')">ファ</div>
    <div class="key" onclick="check('ソ')">ソ</div>
    <div class="key" onclick="check('ラ')">ラ</div>
    <div class="key" onclick="check('シ')">シ</div>
    <div class="key" onclick="check('ド(高)')">ド</div>
  </div>

  <button id="next-btn" class="next-btn" onclick="nextQuestion()">つぎへ進む ➔</button>
</div>

<script>
const SOUNDS = {
  "ド": "pi do.wav",
  "レ": "pi re.wav",
  "ミ": "pi mi.wav",
  "ファ": "pi fa.wav",
  "ソ": "pi so.wav",
  "ラ": "pi ra.wav",
  "シ": "pi si.wav",
  "ド(高)": "pi do high.wav"
};

const notes = ["ド", "レ", "ミ", "ファ", "ソ", "ラ", "シ", "ド(高)"];
const noteY = [78, 73, 68, 63, 58, 53, 48, 43];
let currentQ = 1;
let correctCount = 0;
let targetNote = "";
let answered = false;

function start() {
  answered = false;
  document.getElementById('next-btn').style.display = 'none';
  const idx = Math.floor(Math.random() * notes.length);
  targetNote = notes[idx];
  
  const layer = document.getElementById('note-layer');
  layer.innerHTML = '';
  
  // おんぷを書く
  const y = noteY[idx];
  const circle = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
  circle.setAttribute("cx", "100"); circle.setAttribute("cy", y);
  circle.setAttribute("rx", "7"); circle.setAttribute("ry", "5");
  circle.setAttribute("fill", "#000");
  circle.setAttribute("transform", `rotate(-20, 100, ${y})`);
  layer.appendChild(circle);
  
  if (idx === 0) { // 下のドの線
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", "85"); line.setAttribute("y1", "78");
    line.setAttribute("x2", "115"); line.setAttribute("y2", "78");
    line.setAttribute("stroke", "#000");
    layer.appendChild(line);
  }
}

function check(note) {
  if (answered) return;

  // 音をならす
  const audio = new Audio(SOUNDS[note]);
  audio.play();

  answered = true;
  if (note === targetNote) {
    correctCount++;
    document.getElementById('correct-count').innerText = correctCount;
  }

  document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
  if (currentQ >= 10) {
    alert("おわり！ " + correctCount + "点だったよ！");
    location.reload();
  } else {
    currentQ++;
    document.getElementById('q-num').innerText = currentQ;
    start();
  }
}

// さいしょのスタート
start();
</script>
</body>
</html>
