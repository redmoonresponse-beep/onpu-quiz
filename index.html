<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>音あてクイズ 🎹</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#f5f4ef;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items: center;
  padding: 10px;
}
#app{width:100%; max-width: 900px;}

.main-container {
  display: flex;
  flex-direction: row;
  gap: 15px;
  align-items: stretch;
}

@media (max-aspect-ratio: 1/1) {
  .main-container { flex-direction: column; }
}

.left-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.right-panel { flex: 1.2; display: flex; flex-direction: column; justify-content: center; }

.card { background:#fff; border:1px solid #e5e4de; border-radius:12px; padding:10px; }

.stats-row{ display:flex; gap:10px; margin-bottom: 10px; }
.stat{ flex:1; background:#fff; border-radius:10px; padding:5px; text-align:center; border:1px solid #e5e4de; }
.stat-label{ font-size:10px; color:#999; }
.stat-value{ font-size:16px; font-weight:600; }

.staff-container{ background: #fff; display: flex; justify-content: center; }
#staff-svg { width: 100%; max-height: 120px; }

#flower-stage { width:100%; height:120px; background: #fff; border-radius: 8px; }

.piano-outer { position: relative; width: 100%; height: 160px; margin: 0 auto; user-select: none; }
.piano { position: relative; width: 350px; height: 150px; margin: 0 auto; }
.white-key {
  position:absolute; width:50px; height:150px;
  background:#fff; border:1px solid #ccc; border-radius:0 0 5px 5px;
  cursor:pointer; z-index:1; transition: background 0.1s;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; font-size: 12px; color: #bbb;
}
.white-key.pressed { background:#ddd; transform: translateY(2px); }
.black-key {
  position:absolute; width:32px; height:90px;
  background:#333; border-radius:0 0 3px 3px;
  cursor:pointer; z-index:2; transition: background 0.1s;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-size: 10px; color: #666;
}
.black-key.pressed { background:#000; transform: translateY(2px); }

.next-btn{ display:none; width:100%; padding:15px; border-radius:10px; background:#4a8c3f; color:#fff; border:none; cursor:pointer; font-size: 16px; margin-top: 10px;}
.next-btn.visible{ display:block; }

.result-card { display:none; text-align:center; padding: 20px; }
.result-card.visible { display:block; }
.restart-btn { margin-top:15px; padding:12px 24px; border-radius:25px; background:#1a1a1a; color:#fff; border:none; cursor:pointer; font-size: 16px; }
</style>
</head>
<body>
<div id="app">
  <div id="quiz-section">
    <div class="stats-row">
      <div class="stat"><div class="stat-label">問題</div><div class="stat-value" id="q-num">1 / 10</div></div>
      <div class="stat"><div class="stat-label">正解数</div><div class="stat-value" id="correct-count">0</div></div>
    </div>

    <div class="main-container">
      <div class="left-panel">
        <div class="card staff-container">
          <svg id="staff-svg" viewBox="0 0 200 100">
            <line x1="10" y1="30" x2="190" y2="30" stroke="#ccc" />
            <line x1="10" y1="40" x2="190" y2="40" stroke="#ccc" />
            <line x1="10" y1="50" x2="190" y2="50" stroke="#ccc" />
            <line x1="10" y1="60" x2="190" y2="60" stroke="#ccc" />
            <line x1="10" y1="70" x2="190" y2="70" stroke="#ccc" />
            <text x="15" y="65" font-size="40" fill="#333" font-family="serif">北</text> <text x="15" y="65" font-size="40" fill="#333" font-family="serif">𝄞</text>
            <g id="note-group"></g>
          </svg>
        </div>
        <div class="card" id="flower-stage">
          <svg width="100%" height="100%" viewBox="0 0 300 120">
            <ellipse cx="150" cy="115" rx="50" ry="5" fill="#d2b48c" />
            <line id="stem" x1="150" y1="115" x2="150" y2="115" stroke="#4a8c3f" stroke-width="4" />
            <circle id="flower-head" cx="150" cy="115" r="0" fill="#f06292" />
          </svg>
        </div>
      </div>

      <div class="right-panel">
        <div class="piano-outer">
          <div class="piano" id="piano-container"></div>
        </div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題へ ➔</button>
      </div>
    </div>
  </div>

  <div class="card result-card" id="result-section">
    <h2 id="result-status">終了！</h2>
    <div style="font-size:48px; margin: 15px 0; font-weight: bold;" id="result-score">0 / 10</div>
    <p id="result-msg" style="margin-bottom: 10px;"></p>
    <button class="restart-btn" onclick="restartQuiz()">もう一度する</button>
  </div>
</div>
