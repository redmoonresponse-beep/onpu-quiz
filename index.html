<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>音あてクイズ 🎹</title>
<style>
  body { font-family: sans-serif; background: #f0f0f0; text-align: center; margin: 0; padding: 10px; }
  #app { max-width: 500px; margin: 0 auto; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  #start-btn { padding: 20px 40px; font-size: 24px; background: #4CAF50; color: white; border: none; border-radius: 50px; cursor: pointer; }
  .stats { margin-bottom: 10px; font-size: 16px; font-weight: bold; }
  .staff-box { background: white; border: 1px solid #ccc; margin-bottom: 20px; padding: 10px; border-radius: 8px; }
  .piano-container { position: relative; width: 100%; height: 180px; background: #333; padding: 2px; border-radius: 5px; margin-bottom: 20px; display: flex; box-sizing: border-box; }
  .key-white { flex: 1; background: white; border: 1px solid #333; border-radius: 0 0 5px 5px; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 15px; font-size: 13px; font-weight: bold; z-index: 1; -webkit-tap-highlight-color: transparent; }
  .key-white:active { background: #ddd; }
  .key-black { position: absolute; width: 8.5%; height: 60%; background: #000; border: 1px solid #222; border-radius: 0 0 3px 3px; z-index: 2; pointer-events: none; }
  .next-btn { display: none; width: 100%; padding: 15px; font-size: 18px; background: #2196F3; color: white; border: none; border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>

<div id="overlay">
  <h2 style="margin-bottom:20px;">音あてクイズ</h2>
  <button id="start-btn" onclick="setup()">はじめる！</button>
</div>

<div id="app">
  <div class="stats">だい <span id="q-num">1</span> / 10 問 | 正解: <span id="correct-count">0</span></div>
  <div class="staff-box">
    <svg viewBox="0 0 200 100" width="100%">
      <line x1="10" y1="30" x2="190" y2="30" stroke="#000" stroke-width="1"/>
      <line x1="10" y1="40" x2="190" y2="40" stroke="#000" stroke-width="1"/>
      <line x1="10" y1="50" x2="190" y2="50" stroke="#000" stroke-width="1"/>
      <line x1="10" y1="60" x2="190" y2="60" stroke="#000" stroke-width="1"/>
      <line x1="10" y1="70" x2="190" y2="70" stroke="#000" stroke-width="1"/>
      <text x="10" y="65" font-size="30">𝄞</text>
      <g id="note-layer"></g>
    </svg>
  </div>

  <div class="piano-container">
    <div class="key-white" onclick="tap('ド')">ド</div>
    <div class="key-white" onclick="tap('レ')">レ</div>
    <div class="key-white" onclick="tap('ミ')">ミ</div>
    <div class="key-white" onclick="tap('ファ')">ファ</div>
    <div class="key-white" onclick="tap('ソ')">ソ</div>
    <div class="key-white" onclick="tap('ラ')">ラ</div>
    <div class="key-white" onclick="tap('シ')">シ</div>
    <div class="key-white" onclick="tap('ド(高)')">ド</div>
    <div class="key-black" style="left: 8.5%;"></div>
    <div class="key-black" style="left: 21%;"></div>
    <div class="key-black" style="left: 46%;"></div>
    <div class="key-black" style="left: 58.5%;"></div>
    <div class="key-black" style="left: 71%;"></div>
  </div>
  <button id="next-btn" class="next-btn" onclick="nextQuestion()">つぎへ進む ➔</button>
</div>

<script>
const SOUNDS = {
  "ド": "pi do.wav", "レ": "pi re.wav", "ミ": "pi mi.wav", "ファ": "pi fa.wav",
  "ソ": "pi so.wav", "ラ": "pi ra.wav", "シ": "pi si.wav", "ド(高)": "pi do high.wav"
};
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const notes = ["ド", "レ", "ミ", "ファ", "ソ", "ラ", "シ", "ド(高)"];
const noteY = [78, 73, 68, 63, 58, 53, 48, 43];
let currentQ = 1, correctCount = 0, targetNote = "", answered = false;

function setup() {
  document.getElementById('overlay').style.display = 'none';
  if (audioCtx.state === 'suspended') audioCtx.resume();
  start();
}

function start() {
  answered = false;
  document.getElementById('next-btn').style.display = 'none';
  const idx = Math.floor(Math.random() * notes.length);
  targetNote = notes[idx];
  const layer = document.getElementById('note-layer');
  layer.innerHTML = '';
  const y = noteY[idx];
  const circle = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
  circle.setAttribute("cx", "100"); circle.setAttribute("cy", y);
  circle.setAttribute("rx", "7"); circle.setAttribute("ry", "5");
  circle.setAttribute("fill", "#000");
  circle.setAttribute("transform", `rotate(-20, 100, ${y})`);
  layer.appendChild(circle);
  if (idx === 0) {
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", "85"); line.setAttribute("y1", "78");
    line.setAttribute("x2", "115"); line.setAttribute("y2", "78");
    line.setAttribute("stroke", "#000"); layer.appendChild(line);
  }
}

// 徹底的に音を鳴らす関数
function tap(note) {
  const file = SOUNDS[note];
  
  // 対策1: 通常再生
  const a1 = new Audio(file);
  a1.play().catch(() => {
    // 対策2: スペースを%20に置換して再生
    const a2 = new Audio(file.replace(/ /g, '%20'));
    a2.play().catch(() => {
      // 対策3: 相対パスを明示して再生
      const a3 = new Audio("./" + file);
      a3.play();
    });
  });

  if (answered) return;
  answered = true;
  if (note === targetNote) {
    correctCount++;
    document.getElementById('correct-count').innerText = correctCount;
  }
  document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
  if (currentQ >= 10) {
    alert("おわり！ " + correctCount + "点でした！");
    location.reload();
  } else {
    currentQ++;
    document.getElementById('q-num').innerText = currentQ;
    start();
  }
}
</script>
</body>
</html>
